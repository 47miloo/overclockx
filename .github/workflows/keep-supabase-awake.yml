name: Mantener Supabase despierto

# Despierta el proyecto de Supabase cada pocos días para que el plan gratis no lo pause.
on:
  schedule:
    - cron: '0 12 */3 * *'   # cada 3 días, a las 12:00 UTC (automático)
  workflow_dispatch:          # botón para ejecutarlo a mano cuando quieras

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          echo "Tocando Supabase para mantenerlo activo..."
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://cbdytvhbwvlqijvdzqkb.supabase.co/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Respuesta HTTP: $code"
          if [ "$code" = "200" ]; then
            echo "OK: Supabase respondió, queda activo."
          else
            echo "Aviso: respondió $code. Revisa la clave o la tabla keep_alive."
            exit 1
          fi
